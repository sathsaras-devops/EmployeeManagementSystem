name: Build and Package

on:
  pull_request:
    branches:
      - DEV
  push:
    branches:
      - DEV
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EmployeeManagement.slnx

      - name: Build
        run: dotnet build EmployeeManagement.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EmployeeManagement.slnx --configuration Release --no-build --verbosity normal

  package:
    name: Publish deployment artifact
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EmployeeManagement.slnx

      - name: Publish API
        run: dotnet publish EmployeeManagement.Api/EmployeeManagement.Api.csproj --configuration Release --output ./publish --no-restore

      - name: Create deployment package
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./employee-management-api.zip -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-api
          path: ./employee-management-api.zip
          if-no-files-found: error
          retention-days: 30
